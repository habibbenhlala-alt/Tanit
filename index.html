if(unsub){unsub();unsub=null}
document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
const p=(location.hash.slice(2)||'').split('/'),v=p[0]||'home';
const tab={home:'home',chat:'chat',prog:'prog',more:'more',acc:'more',dict:'more',news:'more'}[v]||'lib';
const A=(h,e,k,on)=>`<a href="#/${h}" class="${on?'on':''}"><b>${e}</b>${t(k)}</a>`;
$('#nav').innerHTML=A('','🏠','home',tab==='home')+A('chat','💬','chat',tab==='chat')+`<a class="fl" href="#/lib" aria-label="lib">🇹🇳</a>`+A('prog','📊','stats',tab==='prog')+A('more','☰','more',tab==='more');
app.classList.remove('fi');void app.offsetWidth;app.classList.add('fi');window.scrollTo(0,0);
const C=await get('content.json');if(!C){app.innerHTML='<div class="empty">⚠️ content.json</div>';return}
if(v==='home')home(C);else if(v==='lib')app.innerHTML=`<h1>${t('lv')}</h1>`+lvCards(C);
else if(v==='lv')subjects(C,p[1]);else if(v==='s')lessonsList(C,p[1],p[2]);else if(v==='lesson')await lesson(C,p[1]);
else if(v==='chat')await chat();else if(v==='dict')await dict();else if(v==='prog')progress(C);
else if(v==='more')more();else if(v==='acc')account();else if(v==='news')await news()}
const lvCards=C=>`<div class="lv">${C.levels.map(l=>`<a class="lc" style="background:linear-gradient(160deg,${LC[l.id]})" href="#/lv/${l.id}"><span style="font-size:1.6rem">${l.id==='1'?'🏛️':'📖'}</span><b>${l.id}</b><em>${lang==='ar'?(l.id==='1'?'ثانوي':'إعدادي'):(l.id==='1'?'secondaire':'collège')}</em><small>${LT[l.id][L()]}</small></a>`).join('')}</div>`;
function home(C){app.innerHTML=`<div class="hero"><div><h1>${t('hello')} 👋</h1><p>${t('hs')}</p></div><div class="sl">${t('slogan')}</div></div>
<h2>🎓 ${t('lv')}</h2>${lvCards(C)}
<div class="ai"><span class="r">🤖</span><div><b>${t('ai')} ✨</b><p>${t('ais')}</p></div><button id="ab">${t('aib')}</button></div>
<div class="sc"><a href="#/acc">${phv('ph')}<b>${t('acc')}</b><small>${t('accs')}</small></a><a href="#/dict"><span class="e">📘</span><b>${t('dict')}</b><small>${t('dicts')}</small></a><a href="#/prog"><span class="e">🏆</span><b>${t('done')}</b><small>${t('dones')}</small></a></div>
<div class="ch"><span>${t('c1')}</span><span>${t('c2')}</span></div>`;
$('#ab').onclick=()=>toast(t('aisoon'))}
function subjects(C,id){const l=C.levels.find(x=>x.id===id);if(!l){app.innerHTML='<div class="empty">404</div>';return}
app.innerHTML=`<a class="back" href="#/lib">${lang==='ar'?'→':'←'} ${t('back')}</a><h1>${pick(l)}</h1><div class="list">${l.subjects.map(s=>`<a class="item" href="#/s/${l.id}/${s.id}"><div class="ic">${s.icon}</div><div><b>${pick(s)}</b><span>${s.lessons.length} ${t('lessons')}</span></div></a>`).join('')}</div>`}
function lessonsList(C,lid,sid){const l=C.levels.find(x=>x.id===lid),s=l&&l.subjects.find(x=>x.id===sid);if(!s){app.innerHTML='<div class="empty">404</div>';return}
app.innerHTML=`<a class="back" href="#/lv/${lid}">${lang==='ar'?'→':'←'} ${t('back')}</a><h1>${s.icon} ${pick(s)}</h1>`+(s.lessons.length?`<div class="list">${s.lessons.map(x=>`<a class="item" href="#/lesson/${x.id}"><div class="ic">${prog[x.id]?'✅':'📖'}</div><div><b>${pick(x)}</b>${prog[x.id]?`<span>${t('score')}: ${prog[x.id].score}%</span>`:''}</div></a>`).join('')}</div>`:`<div class="empty">${t('soon')}</div>`)}
function find(C,id){for(const l of C.levels)for(const s of l.subjects){const x=s.lessons.find(y=>y.id===id);if(x)return{l,s,x}}}
const card=c=>`<div class="card"><div class="big">${c.ic||'📘'}</div><div class="cf" lang="fr">${esc(c.fr)}</div><div class="ca">${esc(c.ar)}</div>${c.img?`<img src="${esc(c.img)}" alt="${esc(c.fr)}" loading="lazy">`:''}${c.tip?`<div class="tip">💡 ${esc(c.tip)}</div>`:''}${c.p?`<div class="src">📖 ${esc(c.p)}</div>`:''}</div>`;
const parts=a=>(a||[]).map(p=>`<div class="part"><div class="pi">${p.ic||'📘'}</div><div><b lang="fr">${esc(p.fr)}</b><span>${esc(p.ar)}</span></div></div>`+(p.cards||[]).map(card).join('')).join('');
const blk=a=>(a||[]).map(b=>`<div class="fr" lang="fr">${esc(b.fr)}</div><div class="ar">${esc(b.ar)}</div>`).join('');
const figs=a=>(a&&a.length)?`<h2>🖼️ ${t('figs')}</h2>`+a.map(f=>`<figure><img src="${esc(f.src)}" alt="${esc(f.fr)}" loading="lazy"><div class="ar">${esc(f.fr)}<br>${esc(f.ar)}</div></figure>`).join(''):'';
async function lesson(C,id){const f=find(C,id);if(!f){app.innerHTML='<div class="empty">404</div>';return}
app.innerHTML=sk;const d=await get(f.x.file);if(!d){app.innerHTML=`<div class="empty">⚠️ ${esc(f.x.file)}</div>`;return}
app.innerHTML=`<a class="back" href="#/s/${f.l.id}/${f.s.id}">${lang==='ar'?'→':'←'} ${t('back')}</a><h1>${esc(f.x.fr)}<br><small>${esc(f.x.ar)}</small></h1>`+(d.src?`<div class="src">📖 ${t('ref')}: ${esc(d.src)}</div>`:'')+
(d.video?`<h2>🎬 ${t('video')}</h2><div id="vid"><button class="btn alt" id="pv">▶ ${t('video')}</button></div>`:'')+parts(d.parts)+blk(d.sections)+figs(d.figs)+(d.summary&&d.summary.length?`<h2>📝 ${t('sum')}</h2>`+blk(d.summary):'')+
(d.quiz&&d.quiz.length?`<div class="part"><div class="pi">✍️</div><div><b>${T.quiz[1]}</b><span>${T.quiz[0]}</span></div></div><div id="qz">${d.quiz.map((q,i)=>`<div class="q"><b>${esc(q.q)}</b>${q.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div>`).join('')}</div><button class="btn" id="ck">${t('check')}</button><div id="res"></div>`:'');
const pv=$('#pv');if(pv)pv.onclick=()=>{$('#vid').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(d.video)}" allowfullscreen loading="lazy"></iframe>`};
const ck=$('#ck');if(ck)ck.onclick=()=>{let ok=0;d.quiz.forEach((q,i)=>{const box=document.querySelectorAll('#qz .q')[i],sel=box.querySelector('input:checked'),ls=box.querySelectorAll('label');
ls.forEach(x=>x.classList.remove('ok','no'));ls[q.answer].classList.add('ok');if(sel&&+sel.value===q.answer)ok++;else if(sel)ls[+sel.value].classList.add('no');
if(q.explain&&!box.querySelector('em'))box.insertAdjacentHTML('beforeend',`<em>💡 ${esc(q.explain)}</em>`)});
const sc=Math.round(ok/d.quiz.length*100);prog[id]={score:Math.max(sc,(prog[id]||{}).score||0),date:Date.now()};save();
$('#res').innerHTML=`<div class="empty" style="margin-top:12px"><b>${t('score')}: ${ok}/${d.quiz.length} (${sc}%)</b><br>${sc===100?t('m3'):sc>=60?t('m2'):t('m1')}</div>`}}

/* الحوار: غرفة واحدة */
 async function chat(){app.innerHTML=`<h1>💬 ${t('chat')}</h1><div class="tip2">⚠️ ${t('rules')}</div><div id="ms" class="ms">${sk}</div><div class="cb"><input id="mi" maxlength="300" placeholder="${t('write')}"><button class="btn" id="sd">${t('send')}</button></div>`;
let f=null;try{f=await fb()}catch(e){}
if(!f){$('#ms').innerHTML=`<div class="empty">${t('chatsoon')}</div>`}
else{const q=f.Fs.query(f.Fs.collection(f.db,'rooms','general','messages'),f.Fs.orderBy('ts','desc'),f.Fs.limit(50)),mine=U&&U.uid;
unsub=f.Fs.onSnapshot(q,s=>{const a=[];s.forEach(d=>a.push({id:d.id,...d.data()}));a.reverse();const b=$('#ms');if(!b)return;
b.innerHTML=a.length?a.map(m=>`<div class="m ${m.uid===mine?'me':''}"><span class="mav">${esc(m.av||'🙂')}</span><div class="mb"><b>${esc(m.name)}</b><p>${esc(m.text)}</p>${m.uid===mine?'':`<button class="rp" data-id="${m.id}">🚩 ${t('report')}</button>`}</div></div>`).join(''):`<div class="empty">${t('empty')}</div>`;
b.scrollTop=b.scrollHeight;b.querySelectorAll('.rp').forEach(x=>x.onclick=async()=>{const u=await cur(f);if(!u){gate();return}try{await f.Fs.addDoc(f.Fs.collection(f.db,'reports'),{room:'general',mid:x.dataset.id,uid:u.uid,ts:f.Fs.serverTimestamp()});toast(t('reported'))}catch(e){}})},()=>{})}
const send=async()=>{const i=$('#mi'),text=i.value.trim().slice(0,300);if(!text)return;
if(!(U&&U.mode==='user')){toast(t('needlogin'));gate();return}if(!f){toast(t('chatsoon'));return}if(Date.now()-lastSend<3000)return;
const u=await cur(f);if(!u){gate();return}lastSend=Date.now();i.value='';
try{await f.Fs.addDoc(f.Fs.collection(f.db,'rooms','general','messages'),{uid:u.uid,name:(U.name||'Élève').slice(0,24),av:U.avatar||'🦊',text,ts:f.Fs.serverTimestamp()})}catch(e){toast(t('loginerr'))}};
$('#sd').onclick=send;$('#mi').onkeydown=e=>{if(e.key==='Enter')send()}}

async function dict(){const D=await get('dictionary.json')||[];app.innerHTML=`<h1>📘 ${t('dict')}</h1><input type="search" id="sq" placeholder="${t('search')}"><div id="dl" class="list"></div>`;
const draw=q=>{q=q.trim().toLowerCase();const r=D.filter(x=>!q||x.fr.toLowerCase().includes(q)||x.ar.includes(q));
$('#dl').innerHTML=r.length?r.map(x=>`<div class="item"><div style="flex:1"><b dir="ltr" lang="fr">${esc(x.fr)}</b><span dir="rtl" style="display:block">${esc(x.ar)}</span></div></div>`).join(''):`<div class="empty">${D.length?t('noresult'):t('soon')}</div>`};
draw('');$('#sq').oninput=e=>draw(e.target.value)}
async function news(){const N=await get('news.json')||[];app.innerHTML=`<h1>📰 ${t('news')}</h1>`+(N.length?`<div class="list">${N.map(n=>`<div class="item"><div><b>${esc(pick(n.title||n))}</b><span>${esc(n.date||'')}</span>${n.text?`<p>${esc(pick(n.text))}</p>`:''}</div></div>`).join('')}</div>`:`<div class="empty">${t('none')}</div>`)}
function progress(C){let tot=0;C.levels.forEach(l=>l.subjects.forEach(s=>tot+=s.lessons.length));const ks=Object.keys(prog).filter(k=>find(C,k)),d=ks.length,pc=tot?Math.round(d/tot*100):0;
app.innerHTML=`<h1>📊 ${t('stats')}</h1><div class="item" style="display:block"><b>${t('pct')}: ${pc}% (${d}/${tot})</b><div class="bar" style="margin-top:8px"><i style="width:${pc}%"></i></div></div>`+
(d?`<h2>🏆 ${t('done')}</h2><div class="list">${ks.map(k=>{const f=find(C,k);return `<a class="item" href="#/lesson/${k}"><div class="ic">✅</div><div><b>${pick(f.x)}</b><span>${prog[k].score}%</span></div></a>`}).join('')}</div>`:`<div class="empty" style="margin-top:12px">${t('none')}</div>`)}
function account(){const g=!(U&&U.mode==='user');app.innerHTML=`<div class="pf">${phv('big')}<button class="btn alt" id="pp">📷 ${t('photo')}</button><h1>${esc(nm()||t('guestname'))}</h1><div class="src">${g?'':esc((U&&U.email)||'')}</div><div class="avs">${AV.map(a=>`<button data-a="${a}">${a}</button>`).join('')}</div><button class="item" id="en">✏️ ${t('editname')}</button>${g?`<button class="item" id="lg" style="margin-top:8px">🔑 ${t('login')}</button>`:`<button class="item" id="lo" style="margin-top:8px">🚪 ${t('logout')}</button>`}</div>`;
$('#pp').onclick=pickPhoto;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ensureU();U.avatar=b.dataset.a;U.photo=null;saveU();route()});
$('#en').onclick=()=>{ensureU();const n=prompt(t('nameq'),U.name||'');if(n!==null){U.name=n.trim().slice(0,24);saveU();route()}};
const lg=$('#lg');if(lg)lg.onclick=gate;const lo=$('#lo');if(lo)lo.onclick=logout}
function more(){app.innerHTML=`<h1>☰ ${t('more')}</h1><div class="list"><a class="item" href="#/acc"><div class="ic">👤</div><b>${t('acc')}</b></a><a class="item" href="#/dict"><div class="ic">📘</div><b>${t('dict')}</b></a><a class="item" href="#/news"><div class="ic">📰</div><b>${t('news')}</b></a><button class="item" id="ml"><div class="ic">🌐</div><b>${t('lang')}</b></button><button class="item" id="mt"><div class="ic">🌓</div><b>${lang==='ar'?'الوضع: فاتح / داكن / تلقائي':'Mode : clair / sombre / auto'}</b></button><button class="item" id="ms2"><div class="ic">📤</div><b>${t('share')}</b></button><button class="item" id="mi2"><div class="ic">📲</div><b>${t('inst')}</b></button></div>`;
$('#ml').onclick=()=>{lang=lang==='ar'?'fr':'ar';try{localStorage.setItem('tl',lang)}catch(e){}route()};$('#mt').onclick=cycleTheme;
$('#ms2').onclick=async()=>{const u=location.origin+location.pathname;if(navigator.share){try{await navigator.share({title:'TanIT',text:t('sharetx'),url:u})}catch(e){}}else{try{await navigator.clipboard.writeText(u);toast(t('copied'))}catch(e){prompt('',u)}}};
$('#mi2').onclick=async()=>{if(dp){dp.prompt();dp=null}else toast(t('instg'))}}
addEventListener('hashchange',route);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
theme();if(!U)gate();route();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
