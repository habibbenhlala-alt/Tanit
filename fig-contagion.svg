<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250"><rect width="360" height="250" rx="12" fill="#f6faf7"/><g font-family="system-ui,Arial,sans-serif" text-anchor="middle" fill="#10241d"><rect x="8" y="10" width="112" height="110" rx="12" fill="#fff" stroke="#d7e6de"/><text x="64" y="48" font-size="28">😷</text><text x="64" y="70" font-size="11" font-weight="700">Voie respiratoire</text><text x="64" y="86" font-size="10" fill="#0b5d46">الهواء</text><text x="64" y="104" font-size="9">grippe, tuberculose</text><rect x="124" y="10" width="112" height="110" rx="12" fill="#fff" stroke="#d7e6de"/><text x="180" y="48" font-size="28">🍽️</text><text x="180" y="70" font-size="11" font-weight="700">Voie digestive</text><text x="180" y="86" font-size="10" fill="#0b5d46">الأكل والشرب</text><text x="180" y="104" font-size="9">intoxications</text><rect x="240" y="10" width="112" height="110" rx="12" fill="#fff" stroke="#d7e6de"/><text x="296" y="48" font-size="28">⚠️</text><text x="296" y="70" font-size="11" font-weight="700">Voie sexuelle</text><text x="296" y="86" font-size="10" fill="#0b5d46">الاتصال الجنسي</text><text x="296" y="104" font-size="9">SIDA, syphilis</text><rect x="66" y="130" width="112" height="110" rx="12" fill="#fff" stroke="#d7e6de"/><text x="122" y="168" font-size="28">🩸</text><text x="122" y="190" font-size="11" font-weight="700">Voie sanguine</text><text x="122" y="206" font-size="10" fill="#0b5d46">الدم</text><text x="122" y="224" font-size="9">SIDA</text><rect x="182" y="130" width="112" height="110" rx="12" fill="#fff" stroke="#d7e6de"/><text x="238" y="168" font-size="28">🐀</text><text x="238" y="190" font-size="11" font-weight="700">Animaux</text><text x="238" y="206" font-size="10" fill="#0b5d46">فئران وحشرات</text><text x="238" y="224" font-size="9">rat, mouches, moustiques</text></g></svg>
